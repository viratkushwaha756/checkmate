<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS file -->
</head>
<body>

    
    <nav>
        <div class="logo"><h1>Go<span>Trip</span></h1></div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="signup.html">Signup</a></li>
        </ul>
    </nav>

    <div class="signup-container">


        <div class="signup-form">



            <form action="#" method="POST">

                <h2>Signup</h2>
                
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
        
                </div>

                <div class="input-group">
                    <label for="userid">User ID</label>
                    <input type="text" id="userid" name="userid" required placeholder="Enter your user ID">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
               
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
            <p class="redirect-link">Already have an account? <a href="login.html">Login here</a></p>
            

        </div>
    </div>

    <footer>
        <p>&copy; 2025 GoTrip. All Rights Reserved.</p>
    </footer>

</body>
</html>
